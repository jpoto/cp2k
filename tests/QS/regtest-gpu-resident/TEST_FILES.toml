# GPU-resident (Phase A) regtests: NGRIDS 1 so the device-resident grid path
# actually fires. The toggled runs are driven by tools/run_fused_regtests.sh
# (default / CP2K_PW_GPU_FUSED / CP2K_GRID_DEVICE_RESIDENT / both).
# PBE/OT (energy+force) and PBE0 (non-OT, hybrid) exercise the fused Hartree
# chain and Phase A. GAPW is intentionally not here: GAPW + resident hits an
# intermittent "rho0 ... bad integration" warning (see status.md) and is left
# on the regular QS/regtest-gapw-1 fused path until fixed.
"pbe_ot_ngrids1.inp" = [{matcher = "E_total", tol = 1e-7, ref = -68.823553663481349}]
"pbe0_ngrids1.inp"   = [{matcher = "E_total", tol = 1e-7, ref = -18.205586899309857}]
