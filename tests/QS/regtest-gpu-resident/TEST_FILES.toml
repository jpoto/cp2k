# GPU-resident (Phase A) regtests: NGRIDS 1 so the device-resident path can fire.
# The toggled runs are driven by tools/run_fused_regtests.sh
# (default / CP2K_PW_GPU_FUSED / CP2K_GRID_DEVICE_RESIDENT / both).
# PBE/OT and PBE0 (non-OT) use GPW; PBE (non-OT) and PBE0 (OT) use GAPW. For GAPW
# the Phase A grid/potential residency is disabled (GAPW reads host grids), but
# the fused reciprocal chain still applies.
"pbe_ot_ngrids1.inp"       = [{matcher = "E_total", tol = 1e-7, ref = -68.823553663481349}]
"pbe0_ngrids1.inp"         = [{matcher = "E_total", tol = 1e-7, ref = -18.205586899309857}]
"pbe_gapw_ngrids1.inp"     = [{matcher = "E_total", tol = 1e-7, ref = -17.201817648212277}]
"pbe0_ot_gapw_ngrids1.inp" = [{matcher = "E_total", tol = 1e-7, ref = -17.197151515156609}]
#EOF
