# runs are executed in the same order as in this file
# the second field tells which test should be run in order to compare with the last available output
# e.g. 0 means do not compare anything, running is enough
#      1 compares the last total energy in the file
#      for details see cp2k/tools/do_regtest
#
# Test for starting k-point calculation from gamma-point .wfn file
# This test verifies that when WFN_RESTART_FILE_NAME points to a .wfn file
# and k-points are specified, CP2K correctly reads the .wfn file and expands
# it to k-points instead of trying to read a non-existent .kp file

"carbon_gamma_step1.inp"                  = [{matcher="E_total", tol=1e-6, ref=-45.088897351163276}]
"carbon_kp_step2.inp"                     = [{matcher="E_total", tol=1e-6, ref=-45.088897351163276}]
#EOF
